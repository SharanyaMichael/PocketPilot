<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PocketPilot — Logo Formation Animation</title>
<style>
:root{--bg:#050B09;--surface:#091510;--emerald:#10B981;--mint:#6EE7B7;--text:#F0FDF4;--muted:#9CAFA3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.scene{width:min(1120px,96vw);min-height:560px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(110,231,183,.14);border-radius:24px;background:radial-gradient(ellipse at 50% 50%,rgba(16,185,129,.08),transparent 58%),linear-gradient(135deg,#07100c,#050B09 55%,#08140e);box-shadow:0 30px 90px rgba(0,0,0,.38)}
.logo-lockup{width:min(930px,90%);display:flex;align-items:center;justify-content:center;gap:28px;position:relative;z-index:2}
.icon{width:clamp(112px,20vw,230px);height:auto;opacity:0;transform:translateX(100px) scale(.78) rotate(4deg);filter:drop-shadow(0 0 0 rgba(16,185,129,0));animation:iconArrive 1.05s cubic-bezier(.18,.78,.25,1) .15s forwards}
.wordmark{width:clamp(260px,61vw,650px);height:auto;opacity:0;transform:translateX(-115px) scale(.94);animation:wordArrive 1.05s cubic-bezier(.18,.78,.25,1) .48s forwards}
.star{position:absolute;z-index:1;color:var(--mint);font-size:clamp(14px,2vw,24px);line-height:1;opacity:0;animation:twinkle 1.8s ease-in-out infinite}
.star::before{content:"✦";text-shadow:0 0 14px rgba(110,231,183,.4)}
.s1{left:16%;top:25%;animation-delay:.2s}.s2{left:28%;top:69%;font-size:15px;animation-delay:.8s}.s3{right:17%;top:22%;animation-delay:.55s}.s4{right:24%;bottom:23%;font-size:17px;animation-delay:1.1s}.s5{right:12%;top:48%;font-size:12px;animation-delay:.35s}.s6{left:43%;top:17%;font-size:12px;animation-delay:1.35s}
.ring{position:absolute;width:360px;height:360px;border:1px solid rgba(110,231,183,.13);border-radius:50%;opacity:0;animation:ringIn 1.3s ease-out .1s forwards;z-index:0}
.ring::before,.ring::after{content:"";position:absolute;inset:25px;border:1px solid rgba(110,231,183,.09);border-radius:50%}
.ring::after{inset:55px}
.tagline{position:absolute;bottom:72px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.17em;text-transform:uppercase;opacity:0;animation:tagIn .7s ease-out 1.5s forwards}
.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:5}
button{background:#11251B;color:var(--text);border:1px solid rgba(110,231,183,.3);border-radius:999px;padding:10px 17px;font:inherit;font-size:13px;cursor:pointer;transition:background .2s,transform .2s}
button:hover{background:#173528;transform:translateY(-1px)}
@keyframes iconArrive{0%{opacity:0;transform:translateX(100px) scale(.78) rotate(4deg)}70%{opacity:1;transform:translateX(-4px) scale(1.025) rotate(0)}100%{opacity:1;transform:translateX(0) scale(1) rotate(0);filter:drop-shadow(0 8px 18px rgba(16,185,129,.08))}}
@keyframes wordArrive{0%{opacity:0;transform:translateX(-115px) scale(.94)}72%{opacity:1;transform:translateX(5px) scale(1.01)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.45) rotate(-20deg)}35%{opacity:.95;transform:scale(1.12) rotate(8deg)}55%{opacity:.3;transform:scale(.8) rotate(0)}}
@keyframes ringIn{0%{opacity:0;transform:scale(.72)}100%{opacity:1;transform:scale(1)}}
@keyframes tagIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.replay .icon,.replay .wordmark,.replay .ring,.replay .tagline{animation:none;opacity:0}
.replay .icon{transform:translateX(100px) scale(.78) rotate(4deg)}
.replay .wordmark{transform:translateX(-115px) scale(.94)}
.replay .star{animation:none;opacity:0}
.replay.playing .icon{animation:iconArrive 1.05s cubic-bezier(.18,.78,.25,1) .15s forwards}
.replay.playing .wordmark{animation:wordArrive 1.05s cubic-bezier(.18,.78,.25,1) .48s forwards}
.replay.playing .ring{animation:ringIn 1.3s ease-out .1s forwards}
.replay.playing .tagline{animation:tagIn .7s ease-out 1.5s forwards}
.replay.playing .star{animation:twinkle 1.8s ease-in-out infinite}
@media(max-width:600px){.scene{min-height:440px}.logo-lockup{gap:8px;width:95%}.tagline{bottom:74px;font-size:9px}.ring{width:260px;height:260px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
